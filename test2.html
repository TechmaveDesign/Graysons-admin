<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectable Cards</title>
    <script src="https://code.iconify.design/2/2.1.0/iconify.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .selectable-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .selectable-options label {
            cursor: pointer;
        }
        
        .selectable-options .card {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            width: 350px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: 0.3s;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .selectable-options .card:hover {
            border-color: #bbb;
        }
        
        .selectable-options input[type="radio"] {
            display: none;
        }
        
        .selectable-options input[type="radio"]:checked + .card {
            border-color: #007bff;
            box-shadow: 0px 4px 12px rgba(0, 123, 255, 0.3);
        }
        
        .selectable-options .calendar-icon {
            font-size: 22px;
            color: #555;
            margin-right: 10px;
        }
        
        .selectable-options .check-icon {
            font-size: 24px;
            color: #007bff;
            position: absolute;
            right: 16px;
            display: none;
        }
        
        .selectable-options input[type="radio"]:checked + .card .check-icon {
            display: block;
        }
    </style>
</head>
<body>

    <div class="selectable-options">
        <label>
            <input type="radio" name="select" value="1">
            <div class="card">
                <span>
                    <span class="iconify calendar-icon" data-icon="mdi:calendar-outline"></span> 
                    Teach me how to play chess like a pro
                </span>
                <span class="iconify check-icon" data-icon="mdi:check-circle-outline"></span>
            </div>
        </label>
        <label>
            <input type="radio" name="select" value="2">
            <div class="card">
                <span>
                    <span class="iconify calendar-icon" data-icon="mdi:calendar-outline"></span> 
                    Another option goes here
                </span>
                <span class="iconify check-icon" data-icon="mdi:check-circle-outline"></span>
            </div>
        </label>
    </div>

</body>
</html>
